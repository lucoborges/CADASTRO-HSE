name: Deploy Automático .NET Core

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted 
    
    steps:
      - name: Parar, Atualizar e Reiniciar via Agendador
        run: |
          $taskName = "HSE-Cadastros-Service"
          $projectPath = "C:\Users\Administrator\Desktop\HSE-Cadastros\CADASTRO-HSE"
          
          Write-Host "1. Parando o sistema (liberando arquivos)..."
          Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3 # Aguarda o Windows encerrar o processo dotnet
          
          Write-Host "2. Atualizando o código..."
          cd $projectPath
          git pull origin master
          
          Write-Host "3. Iniciando o sistema com o novo código..."
          Start-ScheduledTask -TaskName $taskName
          
          Write-Host "✅ Deploy do .NET Core 8.0 realizado com sucesso!"
