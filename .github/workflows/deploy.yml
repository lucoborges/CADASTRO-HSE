name: Deploy Automático .NET Core

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted 
    
    steps:
      - name: Parar, Atualizar e Compilar o Sistema
        run: |
          $projectPath = "C:\Users\Administrator\Desktop\HSE-Cadastros\CADASTRO-HSE"
          $exePath = "$projectPath\bin\Debug\net8.0\HSE-Cadastros.exe"
          
          Write-Host "1. Parando o processo antigo..."
          Stop-Process -Name "HSE-Cadastros" -Force -ErrorAction SilentlyContinue
          Get-WmiObject Win32_Process -Filter "name = 'dotnet.exe'" | Where-Object { $_.CommandLine -like "*CADASTRO-HSE*" } | ForEach-Object { $_.Terminate() }
          
          Write-Host "Aguardando liberação dos arquivos..."
          Start-Sleep -Seconds 5
          
          Write-Host "2. Atualizando e compilando o código..."
          cd $projectPath
          git pull origin master
          dotnet build
          
          Write-Host "3. Iniciando o sistema em segundo plano..."
          
          # Inicia o processo de forma mais robusta
          Start-Process -FilePath $exePath -WorkingDirectory $projectPath
          
          Write-Host "Aguardando 3 segundos para o sistema subir..."
          Start-Sleep -Seconds 3
          
          # VERIFICAÇÃO AUTOMÁTICA: O próprio log do GitHub vai te dizer se funcionou!
          $proc = Get-Process -Name "HSE-Cadastros" -ErrorAction SilentlyContinue
          if ($proc) {
              Write-Host "✅ SUCESSO ABSOLUTO: O processo HSE-Cadastros está rodando com PID $($proc.Id)!" -ForegroundColor Green
          } else {
              Write-Host "❌ ATENÇÃO: O processo não está rodando. Ele pode ter fechado imediatamente devido a um erro (ex: porta em uso)." -ForegroundColor Red
          }