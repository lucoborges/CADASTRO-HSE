name: Deploy Automático Local

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted 
    
    steps:
      - name: Atualizar código e reciclar App Pool
        run: |
          # 1. Entra na pasta do projeto
          cd C:\Users\Administrator\Desktop\HSE-Cadastros\CADASTRO-HSE
          
          # 2. Puxa as alterações
          git pull origin master
          
          # 3. Recicla o App Pool específico da sua aplicação
          # IMPORTANTE: Troque "NomeDoSeuAppPool" pelo nome real que você anotou!
          C:\Windows\System32\inetsrv\appcmd recycle apppool /apppool.name:"DefaultAppPool"
          
          Write-Host "✅ Deploy realizado e App Pool reciclado com sucesso!"
