name: Deploy Automático Local

on:
  push:
    branches: [master]

jobs:
  deploy:
    # A MÁGICA: roda no seu servidor, NÃO na nuvem do GitHub
    runs-on: self-hosted 
    
    steps:
      - name: Atualizar código e reiniciar IIS
        run: |
          # 1. Entra na pasta do projeto (ajuste o caminho se necessário)
          cd C:\Users\Administrator\Desktop\HSE-Cadastros\CADASTRO-HSE
          
          # 2. Puxa as alterações do GitHub
          git pull origin master
          
          # 3. Reinicia o IIS para aplicar as mudanças do .NET
          iisreset
          
          Write-Host "✅ Deploy realizado com sucesso no servidor local!"
